<!DOCTYPE html>
<html>
<head>
<title>Checkout Form</title>

<style>
*{box-sizing:border-box}
body{
    font-family:Arial;
    background:#eee7f5;
    margin:0;
    padding:30px;
}
.container{
    max-width:750px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px #aaa;
}
h1,h2{text-align:center;color:#6a1b9a}
.progress{
    display:flex;
    justify-content:space-around;
    margin:25px 0;
}
.step{
    padding:10px;
    border-radius:20px;
    background:#ddd;
}
.step.active{background:#6a1b9a;color:white}

.page{display:none}
.page.active{display:block}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}
.full{grid-column:1/3}

input,select,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #bbb;
    border-radius:6px;
}
textarea{height:80px}

.error{
    color:red;
    font-size:12px;
}

.buttons{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

button{
    padding:11px 18px;
    border:0;
    border-radius:7px;
    cursor:pointer;
    background:#6a1b9a;
    color:white;
}
.back{background:#777}

.payment{
    margin:15px 0;
}
.hidden{display:none}

.summary{
    background:#f5f5f5;
    padding:15px;
    border-radius:8px;
    margin-top:20px;
}

@media(max-width:600px){
    .grid{grid-template-columns:1fr}
    .full{grid-column:auto}
}
</style>
</head>

<body>

<div class="container">

<h1>Checkout</h1>
<p style="text-align:center">Complete your purchase</p>

<!-- Progress -->
<div class="progress">
    <div class="step active">1 Billing</div>
    <div class="step">2 Shipping</div>
    <div class="step">3 Payment</div>
    <div class="step">4 Review</div>
</div>

<form id="form">

<!-- BILLING -->
<div class="page active" id="p1">
<h2>Billing Information</h2>

<div class="grid">

<div>
<label>First Name *</label>
<input id="name">
<small class="error" id="nameErr"></small>
</div>

<div>
<label>Last Name *</label>
<input id="last">
<small class="error" id="lastErr"></small>
</div>

<div class="full">
<label>Email *</label>
<input id="email">
<small class="error" id="emailErr"></small>
</div>

<div>
<label>Phone *</label>
<input id="phone" maxlength="10">
<small class="error" id="phoneErr"></small>
</div>

<div>
<label>Country *</label>
<select id="country">
<option value="">Select</option>
<option>India</option>
<option>USA</option>
<option>UK</option>
</select>
<small class="error" id="countryErr"></small>
</div>

<div class="full">
<label>Address *</label>
<textarea id="address"></textarea>
<small class="error" id="addressErr"></small>
</div>

<div>
<label>City *</label>
<input id="city">
<small class="error" id="cityErr"></small>
</div>

<div>
<label>PIN Code *</label>
<input id="pin" maxlength="6">
<small class="error" id="pinErr"></small>
</div>

</div>

<div class="buttons">
<span></span>
<button type="button" class="next" data-next="2">
Next →
</button>
</div>
</div>


<!-- SHIPPING -->
<div class="page" id="p2">
<h2>Shipping Information</h2>

<label>
<input type="checkbox" id="same">
Same as billing
</label>

<div class="grid">

<div>
<label>Full Name *</label>
<input id="sname">
<small class="error" id="snameErr"></small>
</div>

<div>
<label>Phone *</label>
<input id="sphone" maxlength="10">
<small class="error" id="sphoneErr"></small>
</div>

<div class="full">
<label>Address *</label>
<textarea id="saddress"></textarea>
<small class="error" id="saddressErr"></small>
</div>

<div>
<label>City *</label>
<input id="scity">
<small class="error" id="scityErr"></small>
</div>

<div>
<label>PIN *</label>
<input id="spin" maxlength="6">
<small class="error" id="spinErr"></small>
</div>

</div>

<div class="buttons">
<button type="button" class="back" data-prev="1">← Back</button>
<button type="button" class="next" data-next="3">Next →</button>
</div>
</div>


<!-- PAYMENT -->
<div class="page" id="p3">
<h2>Payment</h2>

<div class="payment">
<label><input type="radio" name="pay" value="card" checked> Card</label>
<label><input type="radio" name="pay" value="upi"> UPI</label>
<label><input type="radio" name="pay" value="cod"> COD</label>
</div>

<div id="card">
<input id="cardno" placeholder="16 digit card number" maxlength="16">
<small class="error" id="cardErr"></small>
</div>

<div id="upi" class="hidden">
<input id="upiid" placeholder="example@upi">
<small class="error" id="upiErr"></small>
</div>

<div class="buttons">
<button type="button" class="back" data-prev="2">← Back</button>
<button type="button" class="next" data-next="4">Review →</button>
</div>
</div>


<!-- REVIEW -->
<div class="page" id="p4">
<h2>Order Review</h2>

<div class="summary">
<p><b>Name:</b> <span id="rname"></span></p>
<p><b>Shipping:</b> <span id="rship"></span></p>
<p><b>Payment:</b> <span id="rpay"></span></p>
<p><b>Product:</b> ₹1500</p>
<p><b>Shipping:</b> ₹50</p>
<hr>
<h3>Total: ₹1550</h3>
</div>

<div class="buttons">
<button type="button" class="back" data-prev="3">← Back</button>
<button type="submit">Place Order ✓</button>
</div>
</div>

</form>
</div>


<script>

let current=1;

/* CLICK EVENT */
document.querySelectorAll(".next").forEach(btn=>{
    btn.onclick=()=>{
        if(validate(current)){
            current=+btn.dataset.next;
            show(current);
        }
    };
});

document.querySelectorAll(".back").forEach(btn=>{
    btn.onclick=()=>{
        current=+btn.dataset.prev;
        show(current);
    };
});

function show(n){
    document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
    document.getElementById("p"+n).classList.add("active");

    document.querySelectorAll(".step").forEach((x,i)=>{
        x.classList.toggle("active",i<n);
    });

    if(n==4){
        rname.textContent=name.value+" "+last.value;
        rship.textContent=sname.value+", "+scity.value;
        rpay.textContent=document.querySelector("[name=pay]:checked").value;
    }
}


/* VALIDATION */
function validate(n){

    document.querySelectorAll(".error").forEach(x=>x.textContent="");
    let ok=true;

    if(n==1){
        if(!name.value) nameErr.textContent="Required",ok=false;
        if(!last.value) lastErr.textContent="Required",ok=false;

        if(!email.value.includes("@"))
            emailErr.textContent="Invalid email",ok=false;

        if(!/^\d{10}$/.test(phone.value))
            phoneErr.textContent="Enter 10 digits",ok=false;

        if(!country.value)
            countryErr.textContent="Select country",ok=false;

        if(!address.value)
            addressErr.textContent="Required",ok=false;

        if(!city.value)
            cityErr.textContent="Required",ok=false;

        if(!/^\d{6}$/.test(pin.value))
            pinErr.textContent="Enter 6 digits",ok=false;
    }

    if(n==2){
        if(!sname.value) snameErr.textContent="Required",ok=false;

        if(!/^\d{10}$/.test(sphone.value))
            sphoneErr.textContent="Enter 10 digits",ok=false;

        if(!saddress.value)
            saddressErr.textContent="Required",ok=false;

        if(!scity.value)
            scityErr.textContent="Required",ok=false;

        if(!/^\d{6}$/.test(spin.value))
            spinErr.textContent="Enter 6 digits",ok=false;
    }

    if(n==3){
        let p=document.querySelector("[name=pay]:checked").value;

        if(p=="card" && !/^\d{16}$/.test(cardno.value))
            cardErr.textContent="Enter 16 digit card number",ok=false;

        if(p=="upi" && !upiid.value.includes("@"))
            upiErr.textContent="Invalid UPI ID",ok=false;
    }

    return ok;
}


/* INPUT EVENT */
document.querySelectorAll("input,textarea").forEach(x=>{
    x.addEventListener("input",()=>{
        let e=document.getElementById(x.id+"Err");
        if(e) e.textContent="";
    });
});


/* CHANGE EVENT - PAYMENT */
document.querySelectorAll("[name=pay]").forEach(x=>{
    x.addEventListener("change",()=>{
        card.classList.toggle("hidden",x.value!="card");
        upi.classList.toggle("hidden",x.value!="upi");
    });
});


/* CHANGE EVENT - SAME ADDRESS */
same.onchange=()=>{
    if(same.checked){
        sname.value=name.value+" "+last.value;
        sphone.value=phone.value;
        saddress.value=address.value;
        scity.value=city.value;
        spin.value=pin.value;
    }
};


/* SUBMIT EVENT */
form.onsubmit=e=>{
    e.preventDefault();

    if(validate(3)){
        alert("🎉 Order placed successfully!");
        form.reset();
        current=1;
        show(1);
    }
};

</script>

</body>
</html>
